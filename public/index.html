<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@alexandremace/ui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* La page consomme les tokens du thème @alexandremace/theme */
      :root {
        --radius: 0.625rem;
        --background: #faf8f0;
        --foreground: oklch(0.145 0 0);
        --card: #fdfcf8;
        --primary: #0737ff;
        --primary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.95 0.01 90);
        --muted-foreground: oklch(0.4 0.015 80);
        --border: oklch(0.9 0.015 88);
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Geist", system-ui, sans-serif;
        background: var(--background);
        color: var(--foreground);
        max-width: 40rem;
        margin: 0 auto;
        padding: 5rem 1.5rem;
        line-height: 1.65;
        font-size: 16px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p { margin: 0 0 1.25rem; }
      a {
        color: var(--primary);
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      pre {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.25rem;
        overflow-x: auto;
        margin: 0 0 1.5rem;
      }
      code {
        font-family: "Geist Mono", monospace;
        font-size: 0.85rem;
      }
      .items {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .items a {
        display: inline-flex;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        padding: 0.3rem 0.75rem;
        font-size: 0.875rem;
        color: var(--foreground);
        text-decoration: none;
        transition: border-color 0.15s ease;
      }
      .items a:hover {
        /* même formule que les cartes du portfolio : primary à 40 % */
        border-color: color-mix(in srgb, var(--primary) 40%, transparent);
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <h1>@alexandremace/ui</h1>
    <p>
      Le registry shadcn d'<a href="https://alexandremace.fr">Alexandre Macé</a> :
      un thème et des composants partagés entre projets, sur base React Aria.
    </p>
    <pre><code>npx shadcn@latest add @alexandremace/theme</code></pre>
    <ul class="items">
      <li><a href="/r/theme.json">theme</a></li>
      <li><a href="/r/button.json">button</a></li>
    </ul>
    <p class="muted" style="margin-top: 2.5rem">
      Cette page est stylée avec les tokens du thème : fond sable, cartes,
      bleu, radius.
    </p>
  </body>
</html>
