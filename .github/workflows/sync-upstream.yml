name: Sync upstream shadcn

on:
  schedule:
    - cron: "0 8 * * 1" # lundi matin
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync:upstream -- --apply
      - name: Ouvrir une PR si le stock a bougé
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync stock aria-nova upstream"
          title: "Sync upstream shadcn"
          body: |
            Le stock aria-nova officiel a bougé. Les items stock ont été
            mis à jour automatiquement ; si `upstream/` apparaît dans les
            logs, button ou slider ont du neuf à re-merger à la main
            (nos écarts : outline bg-card, piste/poignée du slider).
          branch: chore/sync-upstream
          delete-branch: true
